services:
  - type: web
    name: supply-chain-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false           # Set this manually in Render dashboard
      - key: SECRET_KEY
        sync: false           # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel frontend URL e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
